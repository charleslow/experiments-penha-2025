[project]
name = "semantic-id-replication"
version = "0.1.0"
description = "Replication of Penha 2025 Semantic ID paper for RecSys"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "lightning>=2.4.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.20.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=16.0.0",
    "faiss-cpu>=1.8.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "torchmetrics>=1.0.0",
    "vector-quantize-pytorch>=1.0.0",
    "scikit-learn>=1.3.0",
    "recbole>=1.2.0",
    "requests>=2.31.0",
    "accelerate>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
